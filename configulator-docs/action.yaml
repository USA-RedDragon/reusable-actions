name: Configulator docs
description: >-
  Keep the configulator config reference table in a Markdown file and the
  example config file up to date. Fails when either is stale, or commits the
  update.
author: USA-RedDragon

branding:
  icon: book-open
  color: blue

inputs:
  type:
    description: The config root type, as passed to `configulator -type`.
    required: true
  dir:
    description: Directory of the package that declares the type, relative to `working-directory`.
    default: '.'
  file:
    description: >-
      Markdown file holding the `<!-- configulator:begin -->` and
      `<!-- configulator:end -->` markers, relative to `working-directory`.
      Empty skips the Markdown table.
    default: README.md
  sample-file:
    description: Example config file to generate, relative to `working-directory`. Empty skips it.
    default: config.example.yaml
  sample-format:
    description: Format of the example config file, `yaml`, `json` or `toml`.
    default: yaml
  env-prefix:
    description: Environment variable prefix shown in the table.
    default: ''
  env-separator:
    description: Environment variable separator shown in the table.
    default: '_'
  flag-separator:
    description: Flag separator shown in the table.
    default: '.'
  working-directory:
    description: Directory containing the go.mod that pins configulator as a tool.
    default: '.'

  setup-go:
    description: Install Go with actions/setup-go using `go-version-file`. Set to `false` if the job already has Go.
    default: 'true'
  go-version-file:
    description: Passed to actions/setup-go, relative to the repository root.
    default: go.mod

  commit:
    description: >-
      Commit the updated file instead of failing. `auto` commits on pushes to
      the default branch and on pull requests from a branch in the same
      repository, such as Renovate's, and fails anywhere else, such as pull
      requests from forks. The checkout token must be allowed to push.
    default: auto
  git-user-name:
    description: Author name for the commit.
    default: github-actions[bot]
  git-user-email:
    description: Author email for the commit.
    default: 41898282+github-actions[bot]@users.noreply.github.com

outputs:
  stale:
    description: '`true` if a file was out of date when the action started.'
    value: ${{ steps.check.outputs.stale }}

runs:
  using: composite
  steps:
    - if: ${{ inputs.setup-go == 'true' }}
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.go-version-file }}

    - id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TYPE: ${{ inputs.type }}
        DIR: ${{ inputs.dir }}
        FILE: ${{ inputs.file }}
        SAMPLE_FILE: ${{ inputs.sample-file }}
        SAMPLE_FORMAT: ${{ inputs.sample-format }}
        ENV_PREFIX: ${{ inputs.env-prefix }}
        ENV_SEPARATOR: ${{ inputs.env-separator }}
        FLAG_SEPARATOR: ${{ inputs.flag-separator }}
        COMMIT: ${{ inputs.commit }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        set -euo pipefail

        version=$(go list -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' github.com/USA-RedDragon/configulator/v2)
        if [[ -n $version ]] && [[ $(printf '%s\n' v2.2.0 "$version" | sort -V | head -n1) != v2.2.0 ]]; then
          echo "::error::configulator ${version} is too old for this action; it needs v2.2.0 or later"
          exit 1
        fi

        render() {
          local rc=0
          if [[ -n $FILE ]]; then
            go tool configulator -dir "$DIR" -type "$TYPE" -markdown -markdown-file "$FILE" \
              -env-prefix "$ENV_PREFIX" -env-separator "$ENV_SEPARATOR" -flag-separator "$FLAG_SEPARATOR" "$@" || rc=1
          fi
          if [[ -n $SAMPLE_FILE ]]; then
            go tool configulator -dir "$DIR" -type "$TYPE" -sample -format "$SAMPLE_FORMAT" -sample-file "$SAMPLE_FILE" "$@" || rc=1
          fi
          return $rc
        }

        if render -check; then
          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "generated config docs are up to date"
          exit 0
        fi
        echo "stale=true" >> "$GITHUB_OUTPUT"

        commit=false
        case "$COMMIT" in
          true) commit=true ;;
          auto)
            if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == "refs/heads/${DEFAULT_BRANCH}" ]]; then
              commit=true
            elif [[ $GITHUB_EVENT_NAME == pull_request && $SAME_REPO_PR == true ]]; then
              commit=true
            fi
            ;;
        esac
        if [[ $commit != true ]]; then
          echo "::error::generated config docs are out of date; see the configulator messages above"
          exit 1
        fi
        echo "commit=true" >> "$GITHUB_OUTPUT"

    - if: ${{ steps.check.outputs.commit == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TYPE: ${{ inputs.type }}
        DIR: ${{ inputs.dir }}
        FILE: ${{ inputs.file }}
        SAMPLE_FILE: ${{ inputs.sample-file }}
        SAMPLE_FORMAT: ${{ inputs.sample-format }}
        ENV_PREFIX: ${{ inputs.env-prefix }}
        ENV_SEPARATOR: ${{ inputs.env-separator }}
        FLAG_SEPARATOR: ${{ inputs.flag-separator }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail

        render() {
          local rc=0
          if [[ -n $FILE ]]; then
            go tool configulator -dir "$DIR" -type "$TYPE" -markdown -markdown-file "$FILE" \
              -env-prefix "$ENV_PREFIX" -env-separator "$ENV_SEPARATOR" -flag-separator "$FLAG_SEPARATOR" "$@" || rc=1
          fi
          if [[ -n $SAMPLE_FILE ]]; then
            go tool configulator -dir "$DIR" -type "$TYPE" -sample -format "$SAMPLE_FORMAT" -sample-file "$SAMPLE_FILE" "$@" || rc=1
          fi
          return $rc
        }

        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"
        branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        message="docs: update generated config docs [skip ci]"
        # A pull request needs checks on its new head commit, or it can't merge.
        if [[ -n ${GITHUB_HEAD_REF:-} ]]; then
          message="docs: update generated config docs"
        fi

        # A push from a shallow clone is rejected.
        if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
          git fetch --quiet --unshallow origin "$branch" || git fetch --quiet --unshallow || true
        fi

        # Another push can land between checkout and here. Regenerate on top
        # of the new tip and try again rather than rebasing.
        for attempt in 1 2 3 4 5; do
          git fetch --quiet origin "$branch"
          git reset --quiet --hard FETCH_HEAD

          render

          paths=()
          [[ -n $FILE ]] && paths+=("$FILE")
          [[ -n $SAMPLE_FILE ]] && paths+=("$SAMPLE_FILE")
          git add -- "${paths[@]}"
          if git diff --cached --quiet -- "${paths[@]}"; then
            echo "generated config docs unchanged, nothing to commit"
            exit 0
          fi

          git commit --quiet -m "$message"
          if git push --quiet origin "HEAD:${branch}"; then
            echo "pushed on attempt ${attempt}"
            exit 0
          fi
          echo "push rejected on attempt ${attempt}, retrying"
        done
        echo "::error::could not push the config docs update after 5 attempts"
        exit 1
